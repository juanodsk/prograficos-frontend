server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta que no sea un archivo real cae en index.html,
  # así el enrutado de React Router (/ordenes, /configuracion/...) funciona
  # también al refrescar o entrar por URL directa.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets con hash en el nombre pueden cachearse agresivamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea, para que un deploy nuevo se vea de inmediato.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Compresión básica.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
